name: Webex Space Release Notification
run-name: ${{ github.actor }} triggered Webex space notification

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Test version number (e.g., 3.10.0)'
        required: false
        default: '3.10.0'
      test_pr_number:
        description: 'Test PR number (e.g., 123)'
        required: false
        default: ''
  workflow_run:
    workflows: ["Deploy CD"]
    types:
      - completed
    branches:
      - next

jobs:
  notify-webex-space:
    name: Send Webex Space Notification
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Get Version and PR from Tag
        id: tag-info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.test_version }}"
            PR_NUMBER="${{ github.event.inputs.test_pr_number }}"
            echo "🧪 TEST MODE: version=${VERSION}, pr=${PR_NUMBER}"
          else
            git fetch --tags
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$VERSION" ]; then
              echo "❌ No tags found"
              exit 1
            fi
            TAG_MESSAGE=$(git tag -l --format='%(contents:subject)' "$VERSION")
            PR_NUMBER=$(echo "$TAG_MESSAGE" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
            COMMIT_HASH=$(echo "$TAG_MESSAGE" | awk '{print $1}')
            echo "📦 Tag: ${VERSION}, PR: #${PR_NUMBER}, Commit: ${COMMIT_HASH}"
            echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
      
      - name: Get Packages from PR
        id: get-packages
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ steps.tag-info.outputs.pr_number }}';
            
            if (!prNumber) {
              console.log('❌ No PR number found, using default package');
              core.setOutput('primary_package', 'webex');
              core.setOutput('packages', JSON.stringify(['webex']));
              return;
            }
            
            console.log(`✅ Getting packages for PR #${prNumber}`);
            
            const packageSet = new Set();
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: parseInt(prNumber, 10),
                per_page: 100
              });
              
              const packageRegex = /^packages\/(@webex\/[^\/]+|[^\/]+)\//;
              for (const file of files) {
                const match = file.filename.match(packageRegex);
                if (match) {
                  packageSet.add(match[1]);
                }
              }
            } catch (error) {
              console.log(`Error listing PR files: ${error.message}`);
            }
            
            if (packageSet.size === 0) {
              packageSet.add('webex');
            }
            
            const packages = Array.from(packageSet);
            const primaryPackage = packages[0];
            
            console.log(`📦 Packages found: ${packages.join(', ')}`);
            console.log(`📦 Primary package: ${primaryPackage}`);
            
            core.setOutput('primary_package', primaryPackage);
            core.setOutput('packages', JSON.stringify(packages));
      
      - name: Post Webex Space Message
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
        run: |
          VERSION="${{ steps.tag-info.outputs.version }}"
          VERSION_NUMBER="${{ steps.tag-info.outputs.version_number }}"
          COMMIT_HASH="${{ steps.tag-info.outputs.commit_hash }}"
          PRIMARY_PACKAGE="${{ steps.get-packages.outputs.primary_package }}"
          PR_NUMBER="${{ steps.tag-info.outputs.pr_number }}"
          
          # Calculate stable version (strip -next.X suffix)
          STABLE_VERSION=$(echo "$VERSION_NUMBER" | sed 's/-next\..*//')
          
          # Build changelog URL with commit hash for reliable filtering
          CHANGELOG_URL="https://web-sdk.webex.com/changelog/?stable_version=${STABLE_VERSION}"
          
          if [ -n "${COMMIT_HASH}" ]; then
            CHANGELOG_URL="${CHANGELOG_URL}&commitHash=${COMMIT_HASH}"
          fi
          
          if [ -n "${PRIMARY_PACKAGE}" ]; then
            ENCODED_PACKAGE=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "${PRIMARY_PACKAGE}")
            CHANGELOG_URL="${CHANGELOG_URL}&package=${ENCODED_PACKAGE}"
          fi
          
          echo "🔗 Changelog URL: ${CHANGELOG_URL}"
          
          # Build the message
          PACKAGE_INFO=""
          if [ -n "${PRIMARY_PACKAGE}" ]; then
            PACKAGE_INFO="**Package:** \`${PRIMARY_PACKAGE}\`\n\n"
          fi
          
          PR_INFO=""
          if [ -n "${PR_NUMBER}" ]; then
            PR_INFO="**PR:** [#${PR_NUMBER}](https://github.com/${{ github.repository }}/pull/${PR_NUMBER})\n\n"
          fi
          
          MESSAGE="🚀 **New SDK Release: ${VERSION}**\n\n${PACKAGE_INFO}${PR_INFO}📖 [View Changelog](${CHANGELOG_URL})\n\nThis release is now available on npm."
          
          echo "📨 Sending message to Webex Space..."
          
          curl -sSf \
            -H "Authorization: Bearer ${WEBEX_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"roomId\":\"${WEBEX_ROOM_ID}\",\"markdown\":\"${MESSAGE}\"}" \
            https://webexapis.com/v1/messages
          
          echo "✅ Message sent successfully!"
